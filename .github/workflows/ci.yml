name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated project
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- SkillsManager.xcodeproj

      - name: Test core package
        run: swift test --package-path Packages/SkillsCore

      - name: Lint Swift
        run: make lint

      - name: Test DMG packaging scripts
        run: make packaging-test

      - name: Test macOS app
        run: >-
          xcodebuild
          -project SkillsManager.xcodeproj
          -scheme SkillsManager
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test

      # This initial distribution artifact intentionally has no Developer ID
      # signature or notarization ticket. Gatekeeper can block or warn about it.
      - name: Build unsigned DMG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make dmg

      - name: Validate unsigned DMG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make verify-dmg

      - name: Upload unsigned DMG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/release/SkillsManager-unsigned.dmg
          if-no-files-found: error
          retention-days: 30
          archive: false
